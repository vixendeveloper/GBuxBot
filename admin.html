<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; text-align: center; }
        .stats-box { background: #007bff; color: white; padding: 20px; text-align: center; border-radius: 8px; font-size: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #218838; }
        .channel-list { margin-top: 20px; }
        .channel-item { display: flex; justify-content: space-between; background: #e9ecef; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .delete-btn { background: #dc3545; padding: 5px 10px; width: auto; font-size: 14px; }
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Bot Admin Panel</h1>
    
    <div class="stats-box">
        👥 Total Users: <span id="totalUsers">Loading...</span>
    </div>

    <h2>Add Must-Join Channel</h2>
    <div class="form-group">
        <label>Channel Name</label>
        <input type="text" id="cName" placeholder="e.g. Official Update Channel">
    </div>
    <div class="form-group">
        <label>Channel ID (e.g. @mychannel or -100123456789)</label>
        <input type="text" id="cId" placeholder="e.g. @gbux_updates">
    </div>
    <div class="form-group">
        <label>Channel Invite Link</label>
        <input type="text" id="cUrl" placeholder="https://t.me/gbux_updates">
    </div>
    <button onclick="addChannel()">➕ Add Channel</button>

    <h2>Active Required Channels</h2>
    <div class="channel-list" id="channelList">
        <!-- Channels will load here -->
    </div>
</div>

<script>
    // সার্ভারের URL (লোকালহোস্ট অথবা Render এর লিঙ্ক)
    const API_BASE = window.location.origin;

    async function loadStats() {
        const res = await fetch(`${API_BASE}/api/admin/stats`);
        const data = await res.json();
        document.getElementById('totalUsers').innerText = data.totalUsers;
    }

    async function loadChannels() {
        const res = await fetch(`${API_BASE}/api/admin/channels`);
        const channels = await res.json();
        const listDiv = document.getElementById('channelList');
        listDiv.innerHTML = '';

        channels.forEach(ch => {
            listDiv.innerHTML += `
                <div class="channel-item">
                    <div>
                        <strong>${ch.name}</strong> (${ch.channelId})<br>
                        <a href="${ch.url}" target="_blank">Link</a>
                    </div>
                    <button class="delete-btn" onclick='deleteChannel(${JSON.stringify(ch)})'>🗑️ Remove</button>
                </div>
            `;
        });
    }

    async function addChannel() {
        const name = document.getElementById('cName').value;
        const channelId = document.getElementById('cId').value;
        const url = document.getElementById('cUrl').value;

        if(!name || !channelId || !url) return alert("Please fill all fields!");

        await fetch(`${API_BASE}/api/admin/channels`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, channelId, url })
        });
        
        document.getElementById('cName').value = '';
        document.getElementById('cId').value = '';
        document.getElementById('cUrl').value = '';
        loadChannels();
    }

    async function deleteChannel(channelObj) {
        if(!confirm("Remove this channel?")) return;
        await fetch(`${API_BASE}/api/admin/channels/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(channelObj)
        });
        loadChannels();
    }

    // পেজ লোড হওয়ার পর ডেটা আনবে
    loadStats();
    loadChannels();
</script>

</body>
</html>
