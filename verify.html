<!DOCTYPE html>
<html>
<head>
    <title>Verify Channels</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .message { margin-top: 20px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Verifying Your Channel Subscriptions...</h1>
    <div id="message" class="message">Please wait...</div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            const messageDiv = document.getElementById('message');

            if (!userId) {
                messageDiv.textContent = 'Error: User ID not found.';
                messageDiv.className = 'message error';
                return;
            }

            try {
                const response = await fetch('https://gbuxbot.onrender.com/api/verify-channel', { // Replace with your actual domain
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: userId })
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.textContent = 'Verification Successful! You can now close this window.';
                    messageDiv.className = 'message success';
                    // Optionally, close the window automatically after a delay
                    // setTimeout(() => window.close(), 3000);
                } else {
                    messageDiv.textContent = `Verification Failed: ${result.message} Please re-join channels and try again.`;
                    messageDiv.className = 'message error';
                }
            } catch (error) {
                console.error('Verification API error:', error);
                messageDiv.textContent = 'An error occurred while verifying. Please try again later.';
                messageDiv.className = 'message error';
            }
        });
    </script>
</body>
</html>
